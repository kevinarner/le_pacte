<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pakt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pakt</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Enregistre le service worker de notifications push dès le chargement
    de la page, en parallèle du démarrage de Flutter (qui prend plusieurs
    secondes) : ça lui laisse le temps de devenir actif avant que l'app
    n'essaie de s'y abonner, plutôt que de le découvrir seulement une fois
    connecté et de tomber sur une "Subscription failed - no active
    Service Worker".
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('firebase-messaging-sw.js');
    }
  </script>

  <!--
    Contact Picker API : permet de choisir un contact directement dans le
    carnet d'adresses du téléphone plutôt que de le saisir à la main.
    Disponible uniquement sur Android + Chrome pour l'instant — ces
    fonctions sont appelées depuis Dart via dart:js_interop
    (lib/services/contact_picker_service.dart), qui gère elle-même
    l'absence de l'API ailleurs.
  -->
  <script>
    function paktContactPickerDisponible() {
      return !!(navigator.contacts && navigator.contacts.select);
    }

    async function paktChoisirContact() {
      try {
        const contacts = await navigator.contacts.select(['name', 'tel'], {multiple: false});
        if (!contacts || contacts.length === 0) return null;
        const contact = contacts[0];
        const nom = (contact.name && contact.name.length > 0) ? contact.name[0] : '';
        const telephone = (contact.tel && contact.tel.length > 0) ? contact.tel[0] : '';
        return JSON.stringify({nom: nom, telephone: telephone});
      } catch (e) {
        return null;
      }
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
